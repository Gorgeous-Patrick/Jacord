[project]
name = "jacord"
version = "0.1.0"
description = "Jacord — Discord-lite chat backend for benchmarking TTG prefetch"
entry-point = "main.jac"

[run]
access_log = "logs/access_log_load_channel_limit0_trial3.csv"
topology_index = true
prefetching = "none"
prefetch_limit = 0
cross_root_resolve = true
async_prefetch = "thread"
prefetch_workers = 4

[serve]
base_route_app = "app"
docs_enabled = true
profile = false

[plugins.scale.database]
mongodb_uri = "mongodb://localhost:27017"
redis_url = "redis://localhost:6379"

[plugins.scale.jwt]
secret = "jacord-dev-secret-change-in-production"
algorithm = "HS256"
exp_delta_days = 7

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"
