[project]
name = "jacord"
version = "0.1.0"
description = "Jacord — Discord-lite chat backend for benchmarking TTG prefetch"
entry-point = "main.jac"

[run]
access_log = ""
topology_index = true
prefetching = "ttg"
prefetch_limit = 10000
cross_root_resolve = false
async_prefetch = "thread"
prefetch_workers = 4

[serve]
base_route_app = "app"
docs_enabled = true
profile = false

[plugins.scale.database]
mongodb_uri = "mongodb://localhost:27017"
redis_url = "redis://localhost:6379"

[plugins.scale.jwt]
secret = "jacord-dev-secret-change-in-production"
algorithm = "HS256"
exp_delta_days = 7
